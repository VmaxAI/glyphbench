# Prime-RL v0.9 / Verifiers v1 single-task recipe.
# Default task: Snake Easy. The submit wrapper can replace the train/eval task
# with Snake Medium while preserving the 1 group x 512 mixed-seed setup.

max_steps = 50
# PrimeRL trainer capacity. Token limits do not belong to the GlyphBench env.
seq_len = 65536
output_dir = "runs/rl/qwen35-4b-glyphbench"

[run]
name = "single-snake-easy-v1"

[env_vars]
HF_HUB_OFFLINE = "1"
TRITON_CACHE_DIR = "/tmp/glyphbench-triton-cache"
TORCHINDUCTOR_CACHE_DIR = "/tmp/glyphbench-torchinductor-cache"

[deployment]
type = "multi_node"
num_train_nodes = 1
num_infer_nodes = 1
num_infer_replicas = 1
gpus_per_node = 8
orchestrator_on_inference = true

[slurm]
job_name = "gb-single-v1"
project_dir = "."
partition = "gpu"
time = "7-00:00:00"
cleanup_grace_period = 120

[model]
name = "Qwen/Qwen3.5-4B"

[weight_broadcast]
type = "nccl"
port = 29501
timeout = 1800

[rollout_transport]
type = "zmq"
port = 29510
hwm = 32

[ckpt]
interval = 10
keep_last = 3
keep_interval = 50

[monitors.wandb]
project = "glyphbench-rl"
group = "qwen35-4b-single-task-v1"
tags = ["glyphbench", "single-task", "prime-rl-v0.9", "verifiers-v1", "ipo"]
offline = false

[trainer]
dist_timeout_seconds = 3600

[trainer.monitors]
file = "None"

[trainer.model]
impl = "auto"
attn = "auto"
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"
optim_cpu_offload = false
fsdp_cpu_offload = false
fused_lm_head_token_chunk_size = 8192
ac_offloading = "None"
compile = "None"

[trainer.model.ac]
mode = "selective"
freq = 1
targets = ["norm", "attn_proj", "mlp", "linear_attn"]

[trainer.optim]
type = "adamw"
lr = 1e-6
betas1 = 0.9
betas2 = 0.95
weight_decay = 0.0
max_norm = 1.0

[trainer.scheduler]
type = "constant"

[trainer.loss]
type = "ipo"
ipo_threshold = 0.1
adv_tau = 1.0
kl_tau = 1e-3

[orchestrator]
batch_size = 512
group_size = 512
max_off_policy_steps = 3
# Keep vLLM telemetry available to adaptive scheduling without exporting every
# per-replica Prometheus counter and histogram to W&B/file monitors.
collect_inference_metrics = false

[orchestrator.monitors]
file = "None"

[orchestrator.algo]
type = "grpo"

[orchestrator.renderer]
name = "qwen3.5"
enable_thinking = true
thinking_retention = "all"

[orchestrator.train]
filter_zero_advantages = true

[orchestrator.train.sampling]
max_completion_tokens = 4096
temperature = 1.0

[[orchestrator.train.source]]
name = "train-snake-easy"
env.taskset.id = "glyphbench"
env.taskset.tasks = ["glyphbench/classics-snake-easy-v0"]
env.taskset.seed = 42
env.taskset.num_seeds = 512
env.taskset.mixed_seeds = true
env.taskset.max_output_tokens = 4096
env.taskset.forfeit_mode = "noop"
env.taskset.use_memory = false
env.player.harness.id = "glyphbench"
env.player.runtime.type = "subprocess"
serve.pool.type = "elastic"
serve.pool.max_workers = 8
serve.pool.multiplex = 128

[orchestrator.eval]
interval = 10
num_examples = 16
group_size = 1
skip_first_step = false

[orchestrator.eval.sampling]
max_completion_tokens = 4096
temperature = 1.0
top_p = 1.0

[[orchestrator.eval.source]]
name = "eval-snake-easy-fixed"
env.taskset.id = "glyphbench"
env.taskset.tasks = ["glyphbench/classics-snake-easy-v0"]
env.taskset.seed = 1000000
env.taskset.num_seeds = 16
env.taskset.mixed_seeds = false
env.taskset.max_output_tokens = 4096
env.taskset.forfeit_mode = "noop"
env.taskset.use_memory = false
env.player.harness.id = "glyphbench"
env.player.runtime.type = "subprocess"

[inference]

[inference.env_vars]
VLLM_CACHE_ROOT = "/tmp/glyphbench-vllm-cache"
FLASHINFER_WORKSPACE_BASE = "/tmp/glyphbench-flashinfer-cache"

[inference.vllm]
max_model_len = 65536
# Scoped mitigation for the pinned vLLM activation kernel; see docs/DEPENDENCIES.md.
max_num_batched_tokens = 8192
enable_chunked_prefill = true
compilation_config = { custom_ops = ["-silu_and_mul"] }
tensor_parallel_size = 1
data_parallel_size = 8
data_parallel_size_local = 8
api_server_count = 8
gpu_memory_utilization = 0.92
enable_prefix_caching = true
enforce_eager = false
gdn_prefill_backend = "triton"
